[project]
name = "ai-trading-pipeline-v3"
version = "0.1.0"
description = "Solo paper-trading BTC bot — predictor / trader / dashboard."
requires-python = ">=3.10"
dependencies = [
    "gdown>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["scripts"]
