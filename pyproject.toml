[project]
name = "ai-trading-pipeline-v3"
version = "0.1.0"
description = "Solo paper-trading BTC bot — predictor / trader / dashboard."
requires-python = ">=3.10"
dependencies = [
    "gdown>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Temporary while `src/` is not present: skip project editable install during `uv sync`.
# Remove this once packaging is wired and the project package should be installed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
# "src" joins this list when Phase 0 creates it — mypy errors on a missing path.
files = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# DTZ (flake8-datetimez) enforces the "all timestamps tz-aware UTC" hard rule mechanically.
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Root scripts bootstrap sys.path before importing the root `constants` module:
# imports below the path setup (E402) and the resulting block order (I001) are intentional.
"scripts/ingest_kraken_history.py" = ["E402", "I001"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
