[project]
name = "ai-trading-pipeline-v3"
version = "0.1.0"
description = "Solo paper-trading BTC bot — predictor / trader / dashboard."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.138.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch>=2.6.0",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Temporary while packaging/editable-install wiring is not configured yet.
# Remove this once packaging is wired and the project package should be installed.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests import both `src.*` packages and the root `constants`.
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["scripts", "src"]

# wandb ships no type stubs; the training script imports it lazily (offline/online modes).
[[tool.mypy.overrides]]
module = ["wandb", "wandb.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# DTZ (flake8-datetimez) enforces the "all timestamps tz-aware UTC" hard rule mechanically.
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Root scripts bootstrap sys.path before importing the root `constants` module:
# imports below the path setup (E402) and the resulting block order (I001) are intentional.
"scripts/train_predictor.py" = ["E402", "I001"]
"scripts/deploy_predictor.py" = ["E402", "I001"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
