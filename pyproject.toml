[project]
name = "ai-trading-pipeline-v3"
version = "0.1.0"
description = "Solo paper-trading BTC bot — predictor / trader / dashboard."
requires-python = ">=3.10"
dependencies = [
    "gdown>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
