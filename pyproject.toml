[project]
name = "ai-trading-pipeline-v3"
version = "0.1.0"
description = "Solo paper-trading BTC bot — predictor / trader / dashboard."
requires-python = ">=3.10"
dependencies = [
    "gdown>=5.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Temporary while `src/` is not present: skip project editable install during `uv sync`.
# Remove this once packaging is wired and the project package should be installed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["src", "scripts"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]
